# Alembic configuration (tasks.md 1.4)
#
# NOTE: Alembic reads this file with the OS locale encoding (GBK on Chinese Windows),
# so this file MUST stay ASCII-only. Keep Chinese notes in alembic/env.py instead.
#
# The database URL is NOT stored here: it comes from the app config
# (env var ZHIXUAN_DATABASE_URL, see app/core/config.py), so migrations and the
# running app never point at different databases.
#
# Common commands (run inside backend/):
#   .venv/Scripts/alembic upgrade head                        create / upgrade tables
#   .venv/Scripts/alembic revision --autogenerate -m "msg"    generate a migration
#   .venv/Scripts/alembic downgrade -1                        roll back one step

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
